name: flutter_unified_map_marker_cluster
description: Marker clustering for flutter_unified_map with the API of flutter_map_marker_cluster and native split, merge and spiderfy animations.
version: 1.0.0
repository: https://github.com/dartstack-dev/flutter_unified_map_marker_cluster
homepage: https://dartstack.dev
issue_tracker: https://github.com/dartstack-dev/flutter_unified_map_marker_cluster/issues
topics:
  - map
  - cluster
  - markers
screenshots:
  - description: "The demo app on a device: hundreds of pins gathered into a single cluster badge on the native map"
    path: screenshots/spiderfy-cluster.png
  - description: "The cluster tapped: its pins spread around it on a spiral, with legs drawn back to the centre"
    path: screenshots/spiderfy-open.png
  - description: "The spider closed again: the spread pins collapse back into their cluster"
    path: screenshots/spiderfy-closed.png
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_map_marker_cluster: ^8.2.2
  flutter_unified_map: ^1.0.0
  flutter_unified_map_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_unified_map_flutter_map: ^1.0.0
  plugin_platform_interface: ^2.1.8
