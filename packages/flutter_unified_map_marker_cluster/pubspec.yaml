name: flutter_unified_map_marker_cluster
description: Marker clustering for flutter_unified_map with the API of flutter_map_marker_cluster and native split, merge and spiderfy animations.
version: 0.1.0
repository: https://github.com/AlphaByte/flutter_unified_map_marker_cluster
topics:
  - map
  - cluster
  - markers
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  clock: ^1.1.2
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  flutter_unified_map: ^0.4.0
  flutter_unified_map_platform_interface: ^0.4.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_unified_map_flutter_map: ^0.4.0
  plugin_platform_interface: ^2.1.8
